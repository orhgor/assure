services:
  assure-celery:
    # The worker carries the ML parse stack (Docling); the app image does not.
    # See Dockerfile.worker for why they are separate images.
    image: ${WORKER_IMAGE:?missing WORKER_IMAGE}
    command: >
      sh -c "exec celery -A prompt_matrix.celery_app:celery_app worker
      --loglevel=info
      --concurrency=1
      -Q sqlite_writes,default"
    environment:
      DATABASE_PATH: /app/data/history.sqlite
      ENVIRONMENT: production
      PYTHONUNBUFFERED: "1"
      TEMP_UPLOAD_DIR: /app/data/tmp_uploads
      SUBSTRATE_ASYNC_UPLOAD: "1"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-sqs://}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-db+sqlite:///data/celery-results.sqlite}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    env_file:
      - path: .env.production
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - assure-app
