{% extends "marketing_base.html" %}
{% block title %}Security | Assure AI{% endblock %}
{% block body %}
  <div class="page rev">
    <div class="page-hero">
      <h1>Security</h1>
      <p class="lede">{{ deployment.model_access }}</p>
    </div>
    <section class="card">
      <h2>Contact</h2>
      <p>Security contact: <a href="mailto:{{ deployment.security_email }}">{{ deployment.security_email }}</a></p>
      <p>Send vulnerability reports to that address.</p>
    </section>
    <p class="rev-close"><a class="btn-primary" href="{{ locale_path }}contact-us/">Book a review</a></p>
  </div>
{% endblock %}
