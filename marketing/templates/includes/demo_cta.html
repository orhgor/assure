<section class="demo-cta">
    <div class="container center">
        {% if cta_modal|default(false) %}
        <button type="button" class="btn-primary" data-demo-open data-i18n="landing.hero.cta_primary">{{ strings.get('landing.hero.cta_primary', 'Book a demo') }}</button>
        {% else %}
        <a href="{{ locale_path }}contact-us/" class="btn-primary" data-i18n="landing.hero.cta_primary">{{ strings.get('landing.hero.cta_primary', 'Book a demo') }}</a>
        {% endif %}
    </div>
</section>
