<section class="demo-cta">

        <button type="button" class="btn-primary" data-waitlist-open data-i18n="landing.hero.cta_primary">{{ strings.get('landing.hero.cta_primary', 'Book a Demo') }}</button>

        {% endif %}
    </div>
</section>
