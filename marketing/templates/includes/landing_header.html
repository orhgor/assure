{# nav_current: "landing" | "about" | "pricing" | "use-cases" #}
<a class="skip-link" href="#main-content" data-i18n="landing.skip">{{ strings.get('landing.skip', 'Skip to content') }}</a>
<header class="site-header">
    <div class="container nav-container">
        <a href="{{ locale_path }}" class="logo logo-brand">
            <img class="brand-mark" src="{{ url_for('static', filename='assure-logo.png') }}" alt="" width="28" height="28">
            <span class="logo-copy">
                <span class="logo-name">{{ brand.name }}</span>
            </span>
        </a>
        <nav class="nav-links is-collapsed" id="landing-nav-links" data-i18n-aria="landing.nav.aria" aria-label="Primary">
            <button type="button" class="nav-menu-toggle" id="nav-menu-toggle" aria-expanded="false" aria-controls="landing-nav-links" data-i18n="landing.nav.menu">{{ strings.get('landing.nav.menu', 'Menu') }}</button>
            <a href="{{ locale_path }}#how-it-works">How it works</a>
            <a href="{{ locale_path }}solutions/"{% if nav_current == 'solutions' %} aria-current="page"{% endif %}>Solutions</a>
            <a href="{{ locale_path }}security/"{% if nav_current == 'security' %} aria-current="page"{% endif %}>Security</a>
            <a href="{{ locale_path }}about/"{% if nav_current == 'about' %} aria-current="page"{% endif %}>About</a>
            <a class="btn-primary nav-cta" href="{{ locale_path }}contact-us/">Book a review</a>
        </nav>
    </div>
</header>
