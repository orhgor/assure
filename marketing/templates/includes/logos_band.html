{# logos_band.html - Trust logos band #}
<div class="logos-band {{ band_class|default('') }}" aria-label="{{ strings.get('trust.logos.aria', 'Trusted by enterprise teams worldwide') }}">
    <div class="trust-logos">
        <img src="{{ url_for('static', filename='logos/aws.svg') }}" alt="Amazon Web Services" height="28">
        <img src="{{ url_for('static', filename='logos/azure.svg') }}" alt="Microsoft Azure" height="28">
        <img src="{{ url_for('static', filename='logos/gcp.svg') }}" alt="Google Cloud" height="28">
        <img src="{{ url_for('static', filename='logos/vercel.svg') }}" alt="Vercel" height="28">
        <img src="{{ url_for('static', filename='logos/linear.svg') }}" alt="Linear" height="28">
        <img src="{{ url_for('static', filename='logos/stripe.svg') }}" alt="Stripe" height="28">
        <img src="{{ url_for('static', filename='logos/github.svg') }}" alt="GitHub" height="28">
    </div>
</div>
