# PostgreSQL + Redis for the venv and pytest. Own project name: without it
# `docker compose -f docker-compose.dev.yml up` shares the project 'assure' with
# the full stack and replaces its postgres/redis (happened 2026-09-24).
name: assure-dev
# Local development infrastructure only (no app container): PostgreSQL and
# Redis on their default ports, matching what tests/conftest.py and .env.example
# assume. The app itself runs from the venv:
#
#   docker compose -f docker-compose.dev.yml up -d
#   uv sync --extra dev
#   DATABASE_URL=postgresql://assure:assure@localhost:5432/assure \
#   REDIS_URL=redis://localhost:6379/0 .venv/bin/pytest -q
#
# Production-shaped stacks (app + worker in containers) are docker-compose.yml
# plus the prod/staging/celery override files.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assure
      POSTGRES_USER: assure
      POSTGRES_PASSWORD: assure
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assure -d assure"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata-dev:
