# Production overrides for EC2 deployment (Cloudflare Tunnel — no public ports).
services:
  assure-app:
    ports: !override
      - "127.0.0.1:8765:8765"
    environment:
      ENVIRONMENT: production
      DATABASE_PATH: /app/data/history.sqlite
      PORT: "8765"
      PYTHONUNBUFFERED: "1"
      GUNICORN_WORKERS: "4"
      GUNICORN_WORKER_CONNECTIONS: "100"
      SQLITE_USE_POOL: "1"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-sqs://}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-db+sqlite:///data/celery-results.sqlite}
      TEMP_UPLOAD_DIR: /app/data/tmp_uploads
      SUBSTRATE_ASYNC_UPLOAD: ${SUBSTRATE_ASYNC_UPLOAD:-0}
      USE_GROUNDRAILS_SERVICE: ${USE_GROUNDRAILS_SERVICE:-0}
      GROUNDRAILS_PYTHON: ${GROUNDRAILS_PYTHON:-/app/.venv312/bin/python}
    env_file:
      - path: .env.production
        required: false
    volumes:
      - ./data:/app/data
      - ./.venv312:/app/.venv312:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1536M
