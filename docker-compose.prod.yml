# Production overrides (EC2 single host behind Cloudflare Tunnel / ALB).
# Fail-fast is on: POSTGRES_PASSWORD and PEM_SECRET_KEY must be set in .env or
# .env.production; login and CSRF are enforced; the image is pulled, not built.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  # Cloud model policies here (ASSURE_LLM_BACKEND empty): the local Ollama pair
  # from the base file moves behind the `local-llm` profile and the web/worker
  # no longer wait for a model pull. COMPOSE_PROFILES=local-llm in the env file
  # brings the models back (the laptop run of staging does that).
  ollama:
    profiles: ["local-llm"]
  ollama-pull:
    profiles: ["local-llm"]
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  assure-app:
    pull_policy: missing
    image: ${APP_IMAGE:?set APP_IMAGE (ghcr.io/orhgor/assure-app:<sha>)}
    build: !reset null
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assure}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-assure}
      ASSURE_LLM_BACKEND: ${ASSURE_LLM_BACKEND:-cloud}   # no Ollama service under this overlay; empty would now mean local
      ENVIRONMENT: production
      ASSURE_ENV: production
      PEM_SECRET_KEY: ${PEM_SECRET_KEY:?set PEM_SECRET_KEY}
      ASSURE_REQUIRE_LOGIN: ${ASSURE_REQUIRE_LOGIN:-true}
      ASSURE_CLERK_ONLY: ${ASSURE_CLERK_ONLY:-1}
      WTF_CSRF_ENABLED: ${WTF_CSRF_ENABLED:-1}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      # Queue: Redis on this host by default; sqs:// on AWS (results then in PostgreSQL).
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      USE_GROUNDRAILS_SERVICE: ${USE_GROUNDRAILS_SERVICE:-0}
  assure-shell:
    # pulled with the others here; the base file's `never` is for the built tag
    pull_policy: missing
  assure-worker:
    pull_policy: missing
    image: ${APP_IMAGE:?set APP_IMAGE (ghcr.io/orhgor/assure-app:<sha>)}
    build: !reset null
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assure}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-assure}
      ASSURE_LLM_BACKEND: ${ASSURE_LLM_BACKEND:-cloud}   # no Ollama service under this overlay; empty would now mean local
      ENVIRONMENT: production
      ASSURE_ENV: production
      PEM_SECRET_KEY: ${PEM_SECRET_KEY:?set PEM_SECRET_KEY}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
