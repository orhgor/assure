<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assure AI — Shell Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shell.css">
</head>
<body class="right-hidden">
  <div class="app-shell">

    <!-- ============================================================= -->
    <!-- ICON RAIL (48px, always on)                                   -->
    <!-- ============================================================= -->
    <aside class="rail" aria-label="Navigation rail">
      <div class="rail-logo" title="Assure AI">
        <svg viewBox="0 0 32 32" width="16" height="16" aria-hidden="true">
          <text x="16" y="22" text-anchor="middle" fill="#ffffff"
                font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="14">A</text>
        </svg>
      </div>

      <nav class="rail-nav" aria-label="Primary">
        <button type="button" class="rail-btn" data-rail-btn="folder" title="Substrate Vault">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <button type="button" class="rail-btn" data-rail-btn="activity" title="Pipeline">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </button>
        <button type="button" class="rail-btn" data-rail-btn="history" title="Time Machine">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
            <polyline points="3 3 3 8 8 8"></polyline>
            <polyline points="12 7 12 12 15 15"></polyline>
          </svg>
        </button>
      </nav>

      <div class="rail-footer">
        <button type="button" class="rail-btn" data-rail-btn="settings" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </aside>

    <!-- ============================================================= -->
    <!-- LEFT PANE (260px, collapsible, starts open)                   -->
    <!-- ============================================================= -->
    <aside class="pane pane-left" aria-label="Time Machine">
      <header class="pane-header">
        <h2 class="pane-title">TIME MACHINE</h2>
        <button type="button" class="pane-collapse" id="left-collapse" aria-label="Collapse left pane" title="Collapse">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </header>
      <div class="pane-body">
        <section class="pane-section">
          <p class="empty-hint">No versions yet</p>
        </section>
        <section class="pane-section">
          <h3 class="section-header">PINNED</h3>
          <p class="empty-hint">No pinned answers</p>
        </section>
      </div>
    </aside>

    <!-- ============================================================= -->
    <!-- CENTER (flex, document + docked prompt)                       -->
    <!-- ============================================================= -->
    <main class="center" aria-label="Workspace">
      <section class="doc-surface" aria-label="Document">
        <div class="doc-empty">
          <p>Write your draft here, or use the input below.</p>
        </div>
      </section>

      <footer class="dock" aria-label="Prompt input">
        <div class="dock-input" id="dock-input-wrap">
          <input type="text"
                 class="dock-text"
                 id="dock-text"
                 placeholder="Draft intent..."
                 autocomplete="off"
                 spellcheck="false">
          <button type="button" class="dock-submit" id="dock-submit" aria-label="Submit">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </footer>
    </main>

    <!-- ============================================================= -->
    <!-- RIGHT PANE (400px, collapsible, hidden by default)           -->
    <!-- ============================================================= -->
    <aside class="pane pane-right" aria-label="Pipeline stages" id="pane-right">
      <header class="pane-header">
        <h2 class="pane-title">PIPELINE</h2>
        <button type="button" class="pane-close" id="right-close" aria-label="Close pipeline pane" title="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>
      <div class="pane-body pipeline-body">
        <ul class="stage-list" role="list">
          <li class="stage-row" data-stage="Preflight"><span class="stage-dot" aria-hidden="true"></span><span class="stage-name">Preflight</span></li>
          <li class="stage-row" data-stage="Drafting"><span class="stage-dot" aria-hidden="true"></span><span class="stage-name">Drafting</span></li>
          <li class="stage-row" data-stage="Lock Inference"><span class="stage-dot" aria-hidden="true"></span><span class="stage-name">Lock Inference</span></li>
          <li class="stage-row" data-stage="Compile"><span class="stage-dot" aria-hidden="true"></span><span class="stage-name">Compile</span></li>
          <li class="stage-row" data-stage="Math Check"><span class="stage-dot" aria-hidden="true"></span><span class="stage-name">Math Check</span></li>
          <li class="stage-row" data-stage="Verify"><span class="stage-dot" aria-hidden="true"></span><span class="stage-name">Verify</span></li>
          <li class="stage-row" data-stage="Complete"><span class="stage-dot" aria-hidden="true"></span><span class="stage-name">Complete</span></li>
        </ul>
        <section class="output-area">
          <p class="empty-hint">Model outputs will appear here.</p>
        </section>
      </div>
    </aside>

  </div>

  <script src="./shell.js" defer></script>
</body>
</html>
