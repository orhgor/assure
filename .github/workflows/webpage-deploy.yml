# Webpage deploy — build static marketing site from main and sync to Cloudflare R2.
#
# WHAT THIS DOES
#   push to main (webpage files) -> build -> upload to R2 (assure-marketing-prod)
#   -> deploy marketing Worker if its source changed -> smoke check.
#
# ISOLATION
#   The build runs ONLY marketing code (marketing/ tree + shared templates,
#   static, i18n). It never imports or starts the workbench app and needs no
#   database. See marketing/README.md.
#
# ONE-TIME SETUP (repo admin, ~2 min):
#   Cloudflare API token with:
#     Account | R2 Storage | Edit
#     Account | Workers Scripts | Edit
#     Account | Cloudflare Pages | Edit
#     Zone (getassureai.com) | Workers Routes | Edit
#   -> GitHub repo secret: CLOUDFLARE_API_TOKEN
#
# Editors: edit the webpage files and push to main. That is the whole job.

name: Webpage deploy (R2)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'landing/**'
      - '.github/workflows/webpage-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'landing/**'
      - '.github/workflows/webpage-deploy.yml'

concurrency:
  group: webpage-deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: '381b292d419f2efdc1c85a3636268e91'
  MARKETING_R2_BUCKET: 'assure-marketing-prod'

jobs:
  isolation:
    # A PR may touch the website or the workbench, never both in one change.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if a PR touches both marketing/ and prompt_matrix/
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files="$(git diff --name-only "$base" "$head")"
          echo "$files" > /tmp/pr_files.txt
          mk=$(grep -c '^marketing/' /tmp/pr_files.txt || true)
          pm=$(grep -c '^prompt_matrix/' /tmp/pr_files.txt || true)
          echo "marketing files: $mk, prompt_matrix files: $pm"
          if [ "$mk" -gt 0 ] && [ "$pm" -gt 0 ]; then
            echo "::error::This PR touches both marketing/ and prompt_matrix/. The website and the workbench must change in separate PRs."
            exit 1
          fi

  website-checks:
    # Website-only checks: build the static site and run the website tests.
    # Never imports or starts the workbench app.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build and test deps
        run: pip install -q -r marketing/requirements.txt pytest pydantic

      - name: Build static marketing site
        run: bash marketing/build.sh

      - name: Website tests
        run: pytest tests/test_counter_copy_i18n.py tests/test_r2_sync_marketing.py -v

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build deps (flask only)
        run: pip install -q -r marketing/requirements.txt

      - name: Build static marketing site
        run: bash marketing/build.sh

      - name: Sync to R2 + deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MARKETING_DEPLOY_FORCE: '1'   # CI has no cooldown; force replaces the local-time guard
        run: bash marketing/deploy.sh --skip-build

      - name: Verify deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '381b292d419f2efdc1c85a3636268e91'
        run: |
          sleep 10
          echo "-- R2 canary (uploaded index.html parses):"
          npx wrangler@4 r2 object get assure-marketing-prod/index.html --pipe --remote | grep -c '<html'
          echo "-- Live page:"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://www.getassureai.com/)
          echo "status=$code"
          test "$code" = "200"