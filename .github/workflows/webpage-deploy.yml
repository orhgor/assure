# Webpage deploy — build static marketing site and ship it as Worker static assets.
#
# WHAT THIS DOES
#   push to main (webpage files) -> build -> deploy the marketing Worker with
#   dist/ as static assets (no R2 in the marketing path) -> smoke check.
#
# ISOLATION
#   The build runs ONLY marketing code (marketing/ tree + shared templates,
#   static, i18n). It never imports or starts the workbench app and needs no
#   database. See marketing/README.md.
#
# ONE-TIME SETUP (repo admin, ~2 min):
#   Cloudflare API token with:
#     Account | Workers Scripts | Edit
#     Zone (assureproof.com) | Workers Routes | Edit
#     Zone (getassureai.com) | Workers Routes | Edit
#   -> GitHub repo secret: CLOUDFLARE_API_TOKEN
#
# Editors: edit the webpage files and push to main. That is the whole job.

name: Webpage deploy (Workers assets)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/webpage-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/webpage-deploy.yml'

concurrency:
  group: webpage-deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: '381b292d419f2efdc1c85a3636268e91'

jobs:
  website-checks:
    # Website-only checks: build the static site and run the website tests.
    # Never imports or starts the workbench app.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build and test deps
        run: pip install -q -r marketing/requirements.txt pytest

      - name: Build static marketing site
        run: bash marketing/build.sh

      - name: Website tests
        run: pytest tests/test_marketing_revision_copy.py -v

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [website-checks]  # Gate deployment on the website checks passing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build deps (flask only)
        run: pip install -q -r marketing/requirements.txt

      - name: Build static marketing site
        run: bash marketing/build.sh

      - name: Deploy Worker + static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash marketing/deploy.sh --skip-build

      - name: Verify live routes and CSS cache version
        run: |
          EXPECTED_CSS=$(grep -oE 'landing\.css\?v=[0-9]+' dist/solutions/index.html | head -1)
          if [ -z "$EXPECTED_CSS" ]; then
            echo "::error::Could not determine expected CSS version from dist/solutions/index.html"
            exit 1
          fi
          echo "Expected asset: $EXPECTED_CSS"

          URLS=(
            "https://assureproof.com/solutions/"
            "https://www.assureproof.com/"
            "https://getassureai.com/solutions/"
          )

          for url in "${URLS[@]}"; do
            passed=false
            for attempt in 1 2 3 4 5; do
              body=$(curl -sSL -w "\n%{http_code}" "$url" || true)
              status=$(echo "$body" | tail -n1)
              html=$(echo "$body" | sed '$d')

              if [ "$status" = "200" ] && echo "$html" | grep -qF "$EXPECTED_CSS"; then
                echo "OK ($status): $url serves $EXPECTED_CSS"
                passed=true
                break
              fi

              echo "Attempt $attempt/5 for $url got status=$status (waiting 3s)..."
              sleep 3
            done

            if [ "$passed" != "true" ]; then
              actual_css=$(echo "$html" | grep -oE 'landing\.css\?v=[0-9]+' | head -1)
              echo "::error::Smoke test failed for $url (HTTP $status, found '${actual_css:-none}', expected '$EXPECTED_CSS')"
              exit 1
            fi
          done