# Webpage deploy — build static marketing site and ship it as Worker static assets.
#
# WHAT THIS DOES
#   push to main (webpage files) -> build -> deploy the marketing Worker with
#   dist/ as static assets (no R2 in the marketing path) -> smoke check.
#
# ISOLATION
#   The build runs ONLY marketing code (marketing/ tree + shared templates,
#   static, i18n). It never imports or starts the workbench app and needs no
#   database. See marketing/README.md.
#
# ONE-TIME SETUP (repo admin, ~2 min):
#   Cloudflare API token with:
#     Account | Workers Scripts | Edit
#     Zone (assureproof.com) | Workers Routes | Edit
#     Zone (getassureai.com) | Workers Routes | Edit
#   -> GitHub repo secret: CLOUDFLARE_API_TOKEN
#
# Editors: edit the webpage files and push to main. That is the whole job.

name: Webpage deploy (Workers assets)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/webpage-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/webpage-deploy.yml'

concurrency:
  group: webpage-deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: '381b292d419f2efdc1c85a3636268e91'

jobs:
  website-checks:
    # Website-only checks: build the static site and run the website tests.
    # Never imports or starts the workbench app.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build and test deps
        run: pip install -q -r marketing/requirements.txt pytest

      - name: Build static marketing site
        run: bash marketing/build.sh

      - name: Website tests
        run: pytest tests/test_marketing_revision_copy.py tests/test_site_static.py tests/test_security_headers.py tests/test_locale_quality.py tests/test_cloudflare_policy.py -v

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [website-checks]  # Gate deployment on the website checks passing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build deps (flask only)
        run: pip install -q -r marketing/requirements.txt

      - name: Build static marketing site
        run: bash marketing/build.sh

      - name: Deploy Worker + static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash marketing/deploy.sh --skip-build

      - name: Verify live routes and CSS cache version
        run: |
          EXPECTED_CSS=$(grep -oE 'landing\.css\?v=[0-9]+' dist/solutions/index.html | head -1)
          if [ -z "$EXPECTED_CSS" ]; then
            echo "::error::Could not determine expected CSS version from dist/solutions/index.html"
            exit 1
          fi
          echo "Expected asset: $EXPECTED_CSS"

          URLS=(
            "https://assureproof.com/solutions/"
            "https://www.assureproof.com/"
            "https://getassureai.com/solutions/"
          )

          for url in "${URLS[@]}"; do
            passed=false
            for attempt in 1 2 3 4 5; do
              body=$(curl -sSL -w "\n%{http_code}" "$url" || true)
              status=$(echo "$body" | tail -n1)
              html=$(echo "$body" | sed '$d')

              if [ "$status" = "200" ] && echo "$html" | grep -qF "$EXPECTED_CSS"; then
                echo "OK ($status): $url serves $EXPECTED_CSS"
                passed=true
                break
              fi

              echo "Attempt $attempt/5 for $url got status=$status (waiting 3s)..."
              sleep 3
            done

            if [ "$passed" != "true" ]; then
              actual_css=$(echo "$html" | grep -oE 'landing\.css\?v=[0-9]+' | head -1)
              echo "::error::Smoke test failed for $url (HTTP $status, found '${actual_css:-none}', expected '$EXPECTED_CSS')"
              exit 1
            fi
          done

      - name: Verify live security headers (WP8)
        run: |
          HEADERS=$(curl -sI --tlsv1.3 'https://assureproof.com/')
          echo "$HEADERS"
          check() {
            if ! echo "$HEADERS" | grep -qiF "$2"; then
              echo "::error::Missing/broken security header on $1: $2"
              exit 1
            fi
          }
          check 'strict-transport-security' 'max-age=31536000; includeSubDomains'
          check 'x-content-type-options' 'nosniff'
          check 'referrer-policy' 'strict-origin-when-cross-origin'
          check 'permissions-policy' 'camera=(), microphone=(), geolocation=()'
          check 'x-frame-options' 'DENY'
          check 'content-security-policy' "frame-ancestors 'none'"
          check 'content-security-policy' "form-action 'self'"
          check 'content-security-policy' "default-src 'self'"
          echo "Security headers verified on the live deployment (TLS 1.3 handshake)."

      - name: Verify live bot/redirect/endpoint policy
        run: |
          code() { curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 15 "$1"; }
          body() { curl -s --max-time 15 "$@"; }

          # Legacy domain consolidation (C12): single 301 hop, path kept.
          r=$(code 'https://getassureai.com/')
          echo "getassureai.com/ -> $r"; [[ "$r" == 301\ https://assureproof.com/* ]] || { echo "::error::getassureai.com root redirect broken"; exit 1; }
          r=$(code 'https://getassureai.com/poc/')
          echo "getassureai.com/poc/ -> $r"; [[ "$r" == 301\ https://assureproof.com/poc/* ]] || { echo "::error::getassureai.com path redirect broken"; exit 1; }
          r=$(code 'http://getassureai.com/de/poc/')
          echo "http getassureai -> $r"; [[ "$r" == 301\ https://assureproof.com/* ]] || { echo "::error::http getassureai redirect broken"; exit 1; }

          # Discovery files.
          grep -q 'Sitemap: https://assureproof.com/sitemap.xml' <(body 'https://assureproof.com/robots.txt') || { echo "::error::robots.txt sitemap missing"; exit 1; }
          body 'https://assureproof.com/llms.txt' | grep -q 'configured per customer deployment' || { echo "::error::llms.txt stale"; exit 1; }
          st=$(body 'https://assureproof.com/.well-known/security.txt')
          echo "$st" | grep -q '^Contact: mailto:' || { echo "::error::security.txt Contact missing"; exit 1; }
          echo "$st" | grep -q '^Expires:' || { echo "::error::security.txt Expires missing"; exit 1; }

          # Endpoint protection: routing, validation, honeypot (sends no email).
          s=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 'https://assureproof.com/api/anything')
          echo "GET /api/anything -> $s"; [[ "$s" == 301 ]] || { echo "::error::GET /api/* fallback changed"; exit 1; }
          s=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"name":"ci","email":"ci@example.com","company_website":"spam.example"}' 'https://assureproof.com/contact-submit')
          echo "POST honeypot contact -> $s"; [[ "$s" == 200 || "$s" == 429 ]] || { echo "::error::contact-submit honeypot routing broken"; exit 1; }
          s=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d 'not-json' 'https://assureproof.com/api/z3-demo')
          echo "POST invalid z3-demo -> $s"; [[ "$s" == 400 || "$s" == 429 ]] || { echo "::error::z3-demo validation broken"; exit 1; }
          s=$(body -X POST -H 'Content-Type: application/json' -d '{"sourceA":{"value":100000},"sourceB":{"value":120000}}' 'https://assureproof.com/api/z3-demo')
          echo "$s" | grep -q '"ok":true' || { echo "::error::z3-demo happy path broken"; exit 1; }
          echo "Bot/redirect/endpoint policy verified live."