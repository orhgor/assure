name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

env:
  IMAGE_NAME: ghcr.io/orhgor/assure-app

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            ASSURE_BUILD_SHA=${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to production EC2 (GHCR pull via SSM)
        env:
          DEPLOY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          ASSURE_INSTANCE_ID: ${{ secrets.ASSURE_INSTANCE_ID }}
          ASSURE_GIT_REF: main
          ASSURE_IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: us-east-1
        run: bash scripts/aws/ssm-redeploy-and-wait.sh
