name: App Docker (Staging)

on:
  workflow_dispatch:

concurrency:
  group: app-docker-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

env:
  IMAGE_NAME: ghcr.io/orhgor/assure-app

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            ASSURE_BUILD_SHA=${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15
    environment: staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to staging EC2 (pull GHCR image)
        env:
          DEPLOY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          ASSURE_INSTANCE_ID: ${{ secrets.STAGING_INSTANCE_ID }}
          ASSURE_GIT_REF: staging
          ASSURE_IMAGE_TAG: staging
          ASSURE_ENVIRONMENT: staging
          AWS_REGION: us-east-1
        run: bash scripts/aws/ssm-redeploy-and-wait.sh
