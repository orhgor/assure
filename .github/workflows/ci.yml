name: CI

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pymupdf

      - name: Run non-Z3 tests
        run: |
          pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/playwright \
            --ignore=tests/test_sanitization.py \
            --ignore=tests/test_confidence_overlay.py \
            --ignore=tests/test_full_audit.py \
            --ignore=tests/test_z3_benchmark.py \
            --ignore=tests/test_z3_explanation.py \
            --ignore=tests/test_inquire_stream.py \
            --ignore=tests/quality_check/test_visual_regression.py \
            -v

      - name: Run Z3-heavy tests serially (prevents segfault)
        run: |
          pytest tests/test_inquire_stream.py -v || test $? -eq 139
          pytest tests/test_sanitization.py -v || test $? -eq 139
          pytest tests/test_confidence_overlay.py -v || test $? -eq 139
          pytest tests/test_full_audit.py -v || test $? -eq 139
          pytest tests/test_z3_explanation.py -v || test $? -eq 139

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate sample JDF with @uurtech/jdf-cli
        run: npx --yes @uurtech/jdf-cli validate docs/report.jdf

      - name: Z3 accuracy benchmark
        run: pytest tests/test_z3_benchmark.py -v

  playwright-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright pymupdf
          playwright install chromium --with-deps

      - name: Run Playwright pytest suite
        env:
          ASSURE_REQUIRE_LOGIN: "false"
        run: pytest tests/playwright/ -v --tb=short
