name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: pem --ci gemini analysis "Summarize" --copy
      - name: Eval
        run: pem eval --dataset prompt_matrix/examples/eval_sample.json
