name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pymupdf

      - name: Run non-Z3 tests
        run: |
          pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/test_sanitization.py \
            --ignore=tests/test_confidence_overlay.py \
            --ignore=tests/test_full_audit.py \
            --ignore=tests/test_z3_benchmark.py \
            --ignore=tests/test_z3_explanation.py \
            -v

      - name: Run Z3-heavy tests serially (prevents segfault)
        run: |
          pytest tests/test_sanitization.py -v
          pytest tests/test_confidence_overlay.py -v
          pytest tests/test_full_audit.py -v
          pytest tests/test_z3_explanation.py -v

      - name: Z3 accuracy benchmark
        run: pytest tests/test_z3_benchmark.py -v
