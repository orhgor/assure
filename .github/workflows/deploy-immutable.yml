name: deploy-immutable

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: staging or production
        required: true
        type: choice
        options:
          - staging
          - production
      image_sha:
        description: Exact SHA to deploy (must exist in GHCR)
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/assure

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ github.event.inputs.target_environment }}
      DEPLOY_SHA: ${{ github.event.inputs.image_sha }}
    steps:
      - name: Validate SHA input
        run: |
          test -n "${DEPLOY_SHA}"
          echo "Deploying ${TARGET_ENV} with image ${IMAGE_NAME}:${DEPLOY_SHA}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set instance ID
        id: instance
        run: |
          if [ "${TARGET_ENV}" = "staging" ]; then
            echo "instance_id=${{ secrets.STAGING_INSTANCE_ID }}" >> $GITHUB_OUTPUT
            echo "branch=staging" >> $GITHUB_OUTPUT
          else
            echo "instance_id=${{ secrets.PROD_INSTANCE_ID }}" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
          fi

      - name: Sync repo files to EC2 via HTTPS
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          BRANCH: ${{ steps.instance.outputs.branch }}
        run: |
          set -euo pipefail
          
          # Sync repo files to EC2 via SSM (no SSH needed)
          aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"cd /srv/assure\",
              \"export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}\",
              \"export GITHUB_REPOSITORY=${{ github.repository }}\",
              \"export GITHUB_SHA=${DEPLOY_SHA}\",
              \"export BRANCH=${BRANCH}\",
              \"mkdir -p /srv/assure\",
              \"cd /srv/assure\",
              \"curl -sL -H \\\"Authorization: Bearer \\$GITHUB_TOKEN\\\" \\\"https://api.github.com/repos/\\$GITHUB_REPOSITORY/zipball/\\$BRANCH\\\" -o repo.zip\",
              \"unzip -o repo.zip -d /tmp/repo && mv /tmp/repo/*/* /srv/assure/ 2>/dev/null || true\",
              \"rm -f repo.zip\",
              \"ls -la /srv/assure\"
            ]" \
            --query 'Command.CommandId' \
            --output text

      - name: Wait for file sync
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          sleep 10
          aws ssm wait \
            --region "${AWS_REGION}" \
            --instance-id "${INSTANCE_ID}" \
            --for "pattern" \
            --pattern "File sync complete" \
            --timeout 60 2>/dev/null || true

      - name: Deploy via SSM
        env:
          APP_IMAGE: ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
          EXPECTED_SHA: ${{ env.DEPLOY_SHA }}
          EXPECTED_BRANCH: ${{ steps.instance.outputs.branch }}
          EXPECTED_TIME: ${{ github.run_id }}
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          ASSURE_SERVICE_API_TOKEN: ${{ secrets.ASSURE_SERVICE_API_TOKEN }}
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"cd /srv/assure\",
              \"export APP_IMAGE=${APP_IMAGE}\",
              \"export EXPECTED_SHA=${EXPECTED_SHA}\",
              \"export EXPECTED_BRANCH=${EXPECTED_BRANCH}\",
              \"export EXPECTED_TIME=${EXPECTED_TIME}\",
              \"export GHCR_READ_USER=${GHCR_READ_USER}\",
              \"export GHCR_READ_TOKEN=${GHCR_READ_TOKEN}\",
              \"export ASSURE_SERVICE_API_TOKEN=${ASSURE_SERVICE_API_TOKEN}\",
              \"export APP_PORT=8765\",
              \"bash /srv/assure/scripts/remote_deploy.sh\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "Waiting for SSM command ${COMMAND_ID} to complete..."
          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --timeout 300

          STATUS=$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'Status' \
            --output text)

          if [ "${STATUS}" != "Success" ]; then
            echo "SSM execution failed with status: ${STATUS}"
            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi

          echo "${TARGET_ENV} deployment successful!"