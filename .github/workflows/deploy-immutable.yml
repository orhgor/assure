name: deploy-immutable

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: staging or production
        required: true
        type: choice
        options:
          - staging
          - production
      image_sha:
        description: Exact SHA to deploy (must exist in GHCR)
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/assure-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ github.event.inputs.target_environment }}
      DEPLOY_SHA: ${{ github.event.inputs.image_sha }}
    steps:
      - name: Validate SHA input
        run: |
          test -n "${DEPLOY_SHA}"
          echo "Deploying ${TARGET_ENV} with image ${IMAGE_NAME}:${DEPLOY_SHA}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set instance ID
        id: instance
        run: |
          if [ "${TARGET_ENV}" = "staging" ]; then
            echo "instance_id=${{ secrets.STAGING_INSTANCE_ID }}" >> $GITHUB_OUTPUT
            echo "branch=staging" >> $GITHUB_OUTPUT
          else
            echo "instance_id=${{ secrets.PROD_INSTANCE_ID }}" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
          fi

      - name: Sync repo files to EC2 via HTTPS
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          BRANCH: ${{ steps.instance.outputs.branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail
          
          # Build the SSM command script with token expanded
          SCRIPT=$(cat <<'EOF'
          set -euo pipefail
          cd /srv/assure
          export GITHUB_TOKEN="${GITHUB_TOKEN}"
          export GITHUB_REPOSITORY="${GITHUB_REPOSITORY}"
          export GITHUB_SHA="${DEPLOY_SHA}"
          export BRANCH="${BRANCH}"
          mkdir -p /srv/assure
          cd /srv/assure
          curl -sL -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/${BRANCH}" -o repo.zip
          unzip -o repo.zip -d /tmp/repo && mv /tmp/repo/*/* /srv/assure/ 2>/dev/null || true
          rm -f repo.zip
          ls -la /srv/assure
          echo "File sync complete"
          EOF
          )
          
          # Base64 encode and send via SSM (piped to bash)
          B64=$(printf '%s' "${SCRIPT}" | base64 -w0)
          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo ${B64} | base64 -d | bash\"]" \
            --query 'Command.CommandId' \
            --output text)
          
          echo "Sync command ID: ${COMMAND_ID}"
          echo "SYNC_COMMAND_ID=${COMMAND_ID}" >> $GITHUB_OUTPUT

      - name: Wait for file sync command to complete
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          SYNC_COMMAND_ID: ${{ steps.sync.outputs.SYNC_COMMAND_ID }}
        run: |
          set -euo pipefail
          echo "Waiting for sync command ${SYNC_COMMAND_ID} to complete..."
          
          TIMEOUT=120
          INTERVAL=10
          ELAPSED=0
          while [ ${ELAPSED} -lt ${TIMEOUT} ]; do
            STATUS=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${SYNC_COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            
            if [ "${STATUS}" = "Success" ]; then
              echo "Sync completed successfully"
              exit 0
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              echo "Sync failed with status: ${STATUS}"
              aws ssm get-command-invocation \
                --region "${AWS_REGION}" \
                --command-id "${SYNC_COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi
            
            echo "  Sync status: ${STATUS} (${ELAPSED}s elapsed)"
            sleep ${INTERVAL}
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          echo "Timeout after ${TIMEOUT}s waiting for sync command"
          exit 1

      - name: Deploy via SSM
        env:
          APP_IMAGE: ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
          EXPECTED_SHA: ${{ env.DEPLOY_SHA }}
          EXPECTED_BRANCH: ${{ steps.instance.outputs.branch }}
          EXPECTED_TIME: ${{ github.run_id }}
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          ASSURE_SERVICE_API_TOKEN: ${{ secrets.ASSURE_SERVICE_API_TOKEN }}
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          
          # Build deploy script (will be piped to bash on EC2)
          SCRIPT=$(cat <<'EOF'
          set -euo pipefail
          cd /srv/assure
          export APP_IMAGE="${APP_IMAGE}"
          export EXPECTED_SHA="${EXPECTED_SHA}"
          export EXPECTED_BRANCH="${EXPECTED_BRANCH}"
          export EXPECTED_TIME="${EXPECTED_TIME}"
          export GHCR_READ_USER="${GHCR_READ_USER}"
          export GHCR_READ_TOKEN="${GHCR_READ_TOKEN}"
          export ASSURE_SERVICE_API_TOKEN="${ASSURE_SERVICE_API_TOKEN}"
          export APP_PORT=8765
          bash /srv/assure/scripts/remote_deploy.sh
          EOF
          )
          
          # Base64 encode and send via SSM (piped to bash)
          B64=$(printf '%s' "${SCRIPT}" | base64 -w0)
          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo ${B64} | base64 -d | bash\"]" \
            --query 'Command.CommandId' \
            --output text)

          echo "Waiting for SSM command ${COMMAND_ID} to complete..."
          
          # Manual timeout polling (aws ssm wait command-executed doesn't support --timeout on all versions)
          TIMEOUT=300
          INTERVAL=10
          ELAPSED=0
          while [ ${ELAPSED} -lt ${TIMEOUT} ]; do
            STATUS=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            
            if [ "${STATUS}" = "Success" ]; then
              echo "Deployment successful!"
              exit 0
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              echo "SSM execution failed with status: ${STATUS}"
              aws ssm get-command-invocation \
                --region "${AWS_REGION}" \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi
            
            echo "  Status: ${STATUS} (${ELAPSED}s elapsed)"
            sleep ${INTERVAL}
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          echo "Timeout after ${TIMEOUT}s waiting for SSM command"
          exit 1