# Production health probe. Weekly only — a 10-minute cron burned included Actions minutes.
name: Synthetic Canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: synthetic-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: [self-hosted, staging]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Production health + sandbox verify
        run: bash scripts/synthetic-canary.sh
