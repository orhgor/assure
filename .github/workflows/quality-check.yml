name: Quality Check

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

concurrency:
  group: quality-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, staging]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests python-dotenv pytest-playwright pymupdf
          playwright install chromium --with-deps

      - name: Load env for key audit (self-hosted)
        run: |
          if [ -f .env.production ]; then
            set -a
            # shellcheck disable=SC1091
            source .env.production
            set +a
          fi
          if [ -f prompt_matrix/.env ]; then
            set -a
            # shellcheck disable=SC1091
            source prompt_matrix/.env
            set +a
          fi
        shell: bash

      - name: API key audit
        run: pytest tests/quality_check/test_api_keys.py -v
        env:
          QUALITY_CHECK_STRICT: ${{ vars.QUALITY_CHECK_STRICT || '0' }}

      - name: Backend smoke tests
        run: pytest tests/quality_check/test_backend_endpoints.py -v

      - name: Design token lint
        run: pytest tests/quality_check/test_design_tokens.py -v

      - name: Frontend UI smoke tests
        run: pytest tests/quality_check/test_frontend_ui.py -v

      - name: Visual regression
        run: pytest tests/quality_check/test_visual_regression.py -v
        continue-on-error: true
