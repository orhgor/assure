# Desktop builds (macOS, Windows, Ubuntu). Artifacts are not published from the webpage repo.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install pyinstaller
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/assure.spec
      - uses: actions/upload-artifact@v4
        with:
          name: assure-${{ matrix.os }}
          path: dist/**
