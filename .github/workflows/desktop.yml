# Desktop builds (macOS, Windows, Ubuntu). Artifacts are not published from the webpage repo.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# macOS/Windows builds require GitHub-hosted runners; Linux uses staging EC2.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-latest
            artifact: macos-latest
          - runs-on: windows-latest
            artifact: windows-latest
          - runs-on: [self-hosted, staging]
            artifact: linux-arm64
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install pyinstaller
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/assure.spec
      - uses: actions/upload-artifact@v4
        with:
          name: assure-${{ matrix.artifact }}
          path: dist/**
