# Staging overrides — isolated SQLite from production.
# Staging runs on its own EC2; keep host port 8765 so SSM health, auto-heal,
# and the Cloudflare tunnel stay on the same loopback URL as production.
# Do not share ./data with production. Image tag is ghcr.io/orhgor/assure-app:staging.
services:
  assure-app:
    ports: !override
      - "127.0.0.1:8765:8765"
    environment:
      ENVIRONMENT: staging
      ASSURE_ENV: staging
      ASSURE_USE_FREE_MODELS: "1"
      DATABASE_PATH: /app/data/history.sqlite
      PORT: "8765"
      PYTHONUNBUFFERED: "1"
      USE_GROUNDRAILS_SERVICE: ${USE_GROUNDRAILS_SERVICE:-0}
    env_file:
      - path: .env.staging
        required: false
    volumes:
      - ./data-staging:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
