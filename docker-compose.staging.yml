# Staging overrides — own PostgreSQL volume and data directory, never
# production's. Host port 8765 stays for SSM health, auto-heal and the tunnel.
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: !override
      - pgdata-staging:/var/lib/postgresql/data
  assure-app:
    image: ${APP_IMAGE:-ghcr.io/orhgor/assure-app:staging}
    build: !reset null
    env_file:
      - path: .env.staging
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assure}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-assure}
      ASSURE_LLM_BACKEND: ${ASSURE_LLM_BACKEND:-}
      ENVIRONMENT: staging
      ASSURE_ENV: staging
      ASSURE_USE_FREE_MODELS: "1"
      PEM_SECRET_KEY: ${PEM_SECRET_KEY:?set PEM_SECRET_KEY}
      ASSURE_REQUIRE_LOGIN: ${ASSURE_REQUIRE_LOGIN:-true}
      WTF_CSRF_ENABLED: ${WTF_CSRF_ENABLED:-1}
    volumes: !override
      - ./data-staging:/app/data
  assure-worker:
    image: ${APP_IMAGE:-ghcr.io/orhgor/assure-app:staging}
    build: !reset null
    env_file:
      - path: .env.staging
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assure}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-assure}
      ASSURE_LLM_BACKEND: ${ASSURE_LLM_BACKEND:-}
      ENVIRONMENT: staging
      ASSURE_ENV: staging
      PEM_SECRET_KEY: ${PEM_SECRET_KEY:?set PEM_SECRET_KEY}
    volumes: !override
      - ./data-staging:/app/data

volumes:
  pgdata-staging:
