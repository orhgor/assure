# Staging overrides — isolated from production EC2/R2/Worker.
services:
  assure-app:
    ports: !override
      - "127.0.0.1:8765:8765"
    environment:
      ENVIRONMENT: staging
      DATABASE_PATH: /app/data/history.sqlite
      PORT: "8765"
      PYTHONUNBUFFERED: "1"
    env_file:
      - path: .env.staging
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
