<div id="command-bar-overlay" class="command-bar-overlay" hidden aria-hidden="true">
  <div class="command-bar-modal" role="dialog" aria-modal="true" aria-labelledby="command-bar-label">
    <label id="command-bar-label" class="visually-hidden" for="command-bar-input" data-i18n="command.bar.label">{{ gettext('What to investigate') }}</label>
    <div class="command-bar-input-wrap">
      <input
        id="command-bar-input"
        type="text"
        class="command-bar-input form-control"
        placeholder="{{ gettext('What are we investigating or drafting?') }}"
        data-i18n-placeholder="command.bar.placeholder"
        autocomplete="off"
        spellcheck="true"
      />
    </div>
    <div
      id="command-bar-dropzone"
      class="command-bar-dropzone"
      tabindex="0"
      aria-label="{{ gettext('Drop source files (optional)') }}"
      data-i18n-aria="command.bar.drop_aria"
    >
      <span class="hint" data-i18n="command.bar.drop_hint">{{ gettext('Drop source files here (optional) — or press Enter to run') }}</span>
      <input type="file" id="command-bar-file-input" multiple accept=".pdf,.png,.jpg,.jpeg,.txt,.md" hidden />
    </div>
    <p id="command-bar-status" class="command-bar-status hint" aria-live="polite"></p>
  </div>
</div>
