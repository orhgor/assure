{#- Shared chrome for the intake pages: /parsing (list) and /parsing/analytics.
    Extracted from parsing.html on 2026-09-27 when the analytics block moved to
    its own page (customer handoff: list-first). One stylesheet, two pages. -#}
  <style>
:root {
  --ink: #0A0A0A;
  --paper: #FAFAF7;
  --surface: #FFFFFF;
  --rule: #E8E8E4;
  --muted: #6B6B66;
  --verified: #0F6E3F;
  --partial: #B8730E;
  --contradicted: #A32D2D;
  --unverified: #9A9A94;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --fs-h1: 24px;
  --fs-h2: 20px;
  --fs-lg: 14px;
  --fs-md: 13px;
  --fs-sm: 12px;
  --fs-xs: 11px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --radius-card: 4px;
  --shadow-1: 0 2px 8px rgba(0, 0, 0, 0.06);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--fs-md);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* ---- header (unchanged chrome) ---- */
.app-header {
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  display: grid;
  grid-template-columns: 280px 1fr 320px;
  align-items: center;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 2;
}
.app-header-left { display: flex; align-items: center; gap: 8px; }
.app-header-right { display: flex; justify-content: flex-end; }
.app-brand { display: flex; align-items: center; gap: 8px; }
.app-brand-icon { width: 24px; height: 24px; }
.app-brand-name { font-size: var(--fs-md); font-weight: 600; letter-spacing: -0.01em; }
.brand-mark rect { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
.brand-mark path { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---- buttons: one primary, tertiary links ---- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  height: 36px;
  padding: 0 16px;
  background: var(--ink);
  color: var(--paper);
  border: 1px solid var(--ink);
  border-radius: var(--radius-card);
  font-family: var(--sans);
  font-size: var(--fs-md);
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: opacity 120ms ease;
}
.btn-primary:hover { opacity: 0.88; }
.btn-primary[disabled] { opacity: 0.5; cursor: default; }

.btn-card {
  display: inline-flex;
  align-items: center;
  height: 32px;
  padding: 0 14px;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--ink);
  border-radius: var(--radius-card);
  font-family: var(--sans);
  font-size: var(--fs-md);
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
}
.btn-card:hover { background: var(--ink); color: var(--paper); }

.btn-tertiary {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 2px;
  background: transparent;
  border: none;
  border-bottom: 1px solid transparent;
  font-family: var(--sans);
  font-size: var(--fs-md);
  font-weight: 450;
  color: var(--muted);
  text-decoration: none;
  cursor: pointer;
  transition: border-color 120ms ease, color 120ms ease;
}
.btn-tertiary:hover { color: var(--ink); border-bottom-color: var(--ink); }

/* ---- page ---- */
.intake {
  max-width: 880px;
  margin: 0 auto;
  padding: var(--space-10) var(--space-6) 80px;
}

.intake-hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: var(--space-6);
  margin-bottom: var(--space-6);
}
.intake-hero h1 {
  font-size: var(--fs-h1);
  font-weight: 600;
  margin: 0 0 var(--space-2);
  letter-spacing: -0.01em;
}
.intake-lede {
  font-size: var(--fs-lg);
  color: var(--muted);
  margin: 0;
}
.intake-actions { display: flex; align-items: center; gap: var(--space-4); flex-shrink: 0; }

.intake-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 0 var(--space-3);
  padding: var(--space-3) 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  margin-bottom: var(--space-8);
  font-size: var(--fs-md);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.intake-summary b { color: var(--ink); font-weight: 500; }
.intake-summary .sep { color: var(--rule); }

.upload-status {
  font-size: var(--fs-sm);
  color: var(--muted);
  min-height: 18px;
  margin: -20px 0 var(--space-4);
}
.upload-status[data-tone="error"] { color: var(--contradicted); }

/* ---- document cards ---- */
.document-list { display: flex; flex-direction: column; gap: var(--space-3); }

.card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  padding: var(--space-5) var(--space-5) var(--space-4);
  transition: box-shadow 120ms ease;
}
.card:hover { box-shadow: var(--shadow-1); }

.card-top {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--space-2) var(--space-6);
  align-items: start;
}
.card-kicker {
  font-size: var(--fs-sm);
  color: var(--muted);
  margin: 0 0 var(--space-1);
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
  word-break: break-word;
}
.card-date { font-size: var(--fs-sm); color: var(--muted); margin-top: var(--space-1); }
.card-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-1); }
.card-doctype { font-size: var(--fs-md); color: var(--ink); }
.card-facts {
  font-size: var(--fs-sm);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.card-facts b { color: var(--ink); font-weight: 500; }

.card-status {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-4);
  padding-top: var(--space-3);
  border-top: 1px solid var(--rule);
}
.status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-md);
  font-weight: 500;
}
.status::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.status--ready { color: var(--verified); }
.status--review { color: var(--partial); }
.status--notype { color: var(--partial); }
.status--conflict { color: var(--contradicted); }
.status--unassessed { color: var(--unverified); }

.chip {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 11px;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--partial);
  background: color-mix(in srgb, var(--partial) 10%, transparent);
  white-space: nowrap;
}
.chip--quiet {
  color: var(--muted);
  background: color-mix(in srgb, var(--muted) 10%, transparent);
}
/* Red-Hat count line: red only for a high finding, amber for medium, quiet for low. */
.chip--redhat { text-decoration: none; }
.chip--redhat[data-tone="high"] { color: var(--contradicted); background: color-mix(in srgb, var(--contradicted) 10%, transparent); }
.chip--redhat[data-tone="low"] { color: var(--muted); background: color-mix(in srgb, var(--muted) 10%, transparent); }
.badge-parser {
  margin-left: auto;
  font-size: var(--fs-xs);
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 1px 6px;
}
.card-note { font-size: var(--fs-sm); color: var(--muted); margin-top: var(--space-2); }

.card-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-4);
  margin-top: var(--space-4);
}
/* An open Details takes its own full-width row; the Review button stays put. */
details.card-details[open] { flex: 1 1 100%; }

/* ---- details (progressive disclosure) ---- */
details.card-details { margin: 0; }
details.card-details > summary {
  list-style: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  height: 24px;
  font-size: var(--fs-md);
  color: var(--muted);
  border-bottom: 1px solid transparent;
}
details.card-details > summary::-webkit-details-marker { display: none; }
details.card-details > summary:hover { color: var(--ink); border-bottom-color: var(--ink); }
details.card-details[open] > summary { color: var(--ink); }
.details-body {
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--rule);
  display: grid;
  gap: var(--space-5);
}
.details-section h3 {
  font-size: var(--fs-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 var(--space-2);
}
.details-section p { margin: 0; font-size: var(--fs-md); }
.details-table { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
.details-table th {
  text-align: left;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--muted);
  padding: 0 var(--space-3) var(--space-1) 0;
  border-bottom: 1px solid var(--rule);
}
.details-table td {
  padding: var(--space-2) var(--space-3) var(--space-2) 0;
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
  font-variant-numeric: tabular-nums;
}
.details-table tr:last-child td { border-bottom: none; }
.details-table .why { color: var(--muted); font-size: var(--fs-sm); }
.details-table .num { text-align: right; white-space: nowrap; }
details.tech > summary {
  cursor: pointer;
  font-size: var(--fs-sm);
  color: var(--muted);
  list-style: none;
}
details.tech > summary::-webkit-details-marker { display: none; }
details.tech > summary::before { content: "+ "; }
details.tech[open] > summary::before { content: "− "; }
details.tech dl {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: var(--space-1) var(--space-4);
  margin: var(--space-2) 0 0;
  font-size: var(--fs-sm);
}
details.tech dt { color: var(--muted); }
details.tech dd { margin: 0; font-family: var(--mono); font-size: var(--fs-xs); }

/* ---- sections: title dominant, hairline above, count secondary ---- */
.section {
  margin: var(--space-10) 0 0;
  padding-top: var(--space-6);
  border-top: 1px solid var(--rule);
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}
.section-head h2 {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}
.section-head .section-meta { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.section-empty { font-size: var(--fs-md); color: var(--muted); margin: 0; }
.section + .document-list { margin-top: var(--space-6); }
.document-list-head { margin: var(--space-8) 0 var(--space-3); }
.document-list-head h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }

/* ---- review queue (calm table) ---- */
.queue-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: var(--fs-md); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-card); }
.queue-table .c-doc { width: 21%; }
.queue-table .c-field { width: 15%; }
.queue-table .c-value { width: 12%; }
.queue-table .c-why { width: 24%; }
.queue-table .c-state { width: 14%; }
.queue-table .c-act { width: 14%; }
.queue-table th {
  text-align: left;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--muted);
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--rule);
  white-space: nowrap;
}
.queue-table td {
  padding: var(--space-3) var(--space-3);
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
}
.queue-table tr:last-child td { border-bottom: none; }
.queue-table tr[hidden] { display: none; }
.queue-row--empty td { background: var(--paper); }
.queue-row--empty .queue-field { color: var(--partial); font-weight: 500; }
.queue-row--empty .queue-field small { color: var(--muted); font-weight: 400; }
.queue-doc { font-weight: 500; overflow-wrap: anywhere; }
.queue-doc small { display: block; font-weight: 400; color: var(--muted); font-size: var(--fs-sm); }
.queue-field small { display: block; color: var(--muted); font-size: var(--fs-sm); }
.queue-value { font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.queue-why { color: var(--ink); overflow-wrap: anywhere; }
.queue-why small { display: block; color: var(--muted); font-size: var(--fs-sm); }
.queue-state { overflow-wrap: anywhere; }
.queue-state .status { font-size: var(--fs-sm); white-space: nowrap; }
.status--accepted { color: var(--verified); }
.status--partial { color: var(--partial); }
.status--unverified { color: var(--unverified); }
.status--disputed { color: var(--partial); }
.status--rejected { color: var(--contradicted); }
.queue-state .sla { display: block; margin-top: var(--space-1); font-size: var(--fs-xs); color: var(--muted); }
.queue-state .chip { display: inline-flex; margin: var(--space-1) 0 0; }
.queue-actions { text-align: right; }
.queue-actions .btn-tertiary { height: 22px; font-size: var(--fs-sm); white-space: nowrap; }
.queue-quick { display: flex; justify-content: flex-end; gap: var(--space-3); margin-bottom: 2px; }
.queue-actions .btn-accept { color: var(--ink); }
.queue-actions .note { display: block; font-size: var(--fs-xs); color: var(--muted); }
.queue-actions .note[data-tone="error"] { color: var(--contradicted); }
.queue-more { margin-top: var(--space-3); }
tr.queue-row--done td { color: var(--muted); }

/* ---- extracted data: one table per document type ---- */
.data-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); margin-bottom: var(--space-4); }
.data-head h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.data-head .data-count { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; margin: 0; }
.data-head .data-count b { color: var(--ink); font-weight: 500; }
.data-head .data-shown { font-size: var(--fs-sm); color: var(--muted); }
.data-actions { display: flex; align-items: center; gap: var(--space-4); margin-left: auto; }
.data-filters { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); margin-bottom: var(--space-5); }
.data-filters select, .data-filters input {
  height: 32px;
  padding: 0 var(--space-3);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--fs-md);
}
.data-filters select { padding-right: var(--space-6); }
.data-filters input { flex: 1 1 200px; min-width: 160px; }
.data-filters input::placeholder { color: var(--unverified); }
.data-filters select:focus, .data-filters input:focus { outline: none; border-color: var(--ink); }
.data-group { margin-top: var(--space-6); }
.data-group:first-of-type { margin-top: 0; }
.data-group[hidden] { display: none; }
.data-group-head { display: flex; align-items: baseline; gap: var(--space-3); margin: 0 0 var(--space-2); }
.data-group-head h3 { font-size: var(--fs-lg); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.data-group-head .section-meta { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.data-frame { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius-card); background: var(--surface); }
.data-table { border-collapse: separate; border-spacing: 0; font-size: var(--fs-md); min-width: 100%; }
.data-table th, .data-table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; white-space: nowrap; }
.data-table th { font-size: var(--fs-xs); font-weight: 500; color: var(--muted); background: var(--surface); }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr[hidden] { display: none; }
.data-table .c-doc { position: sticky; left: 0; z-index: 1; background: var(--surface); min-width: 200px; max-width: 260px; box-shadow: 1px 0 0 var(--rule); }
.data-table td.c-doc { font-weight: 500; white-space: normal; overflow-wrap: anywhere; }
.data-table td.c-doc small { display: block; font-weight: 400; color: var(--muted); font-size: var(--fs-sm); }
.data-table td.c-val { font-variant-numeric: tabular-nums; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.data-table td.c-val[data-mark="missing"], .data-table td.c-val[data-mark="absent"] { color: var(--unverified); }
.data-table td.c-val[data-mark="review"]::before, .data-table td.c-val[data-mark="rejected"]::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: 1px;
}
.data-table td.c-val[data-mark="review"]::before { background: var(--partial); }
.data-table td.c-val[data-mark="rejected"]::before { background: var(--contradicted); }
.data-table .c-act { position: sticky; right: 0; z-index: 1; background: var(--surface); text-align: right; box-shadow: -1px 0 0 var(--rule); }
.data-table td.c-act .btn-tertiary { height: 22px; font-size: var(--fs-sm); margin-left: var(--space-3); }
.data-table td.c-act .btn-tertiary:first-child { margin-left: 0; }
.data-table td.c-none { color: var(--muted); white-space: normal; min-width: 240px; }
.data-legend { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); margin: var(--space-3) 0 0; font-size: var(--fs-xs); color: var(--muted); }
.data-legend span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.data-legend .l-review::before { background: var(--partial); }
.data-legend .l-rejected::before { background: var(--contradicted); }
.data-legend .l-missing::before { display: none; }
.data-empty-filter { font-size: var(--fs-md); color: var(--muted); margin: var(--space-4) 0 0; }

/* ---- analytics: premium report, not BI wall ---- */
.report-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-6);
  padding: var(--space-2) 0 var(--space-6);
}
.metric-label { font-size: var(--fs-sm); color: var(--muted); margin: 0 0 var(--space-1); }
.metric-value {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin: 0;
  font-variant-numeric: proportional-nums;
}
.metric-note { font-size: var(--fs-sm); color: var(--muted); margin: var(--space-1) 0 0; }
.metric-note b { color: var(--partial); font-weight: 500; }

.report-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-8) var(--space-8);
  padding-top: var(--space-5);
  border-top: 1px solid var(--rule);
}
.report-figure h3 {
  font-size: var(--fs-md);
  font-weight: 500;
  color: var(--ink);
  margin: 0 0 var(--space-1);
}
.report-figure .figure-sub { font-size: var(--fs-sm); color: var(--muted); margin: 0 0 var(--space-3); }
.report-figure--wide { grid-column: 1 / -1; }

.spark { display: block; width: 100%; height: auto; overflow: visible; }
.spark .baseline { stroke: var(--rule); stroke-width: 1; }
.spark .line { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.spark .end { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.spark .hit { fill: transparent; }
.spark .hit:hover + .pt, .spark .pt:hover { opacity: 1; }
.spark .pt { fill: var(--ink); stroke: var(--surface); stroke-width: 2; opacity: 0; pointer-events: none; }
.spark-labels { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--muted); margin-top: var(--space-1); font-variant-numeric: tabular-nums; }
.spark-end-label { font-size: var(--fs-sm); color: var(--ink); font-variant-numeric: tabular-nums; }

.hist { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-3); align-items: end; height: 96px; }
.hist-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.hist-count { font-size: var(--fs-sm); color: var(--ink); font-variant-numeric: tabular-nums; margin-bottom: var(--space-1); }
.hist-bar { width: 24px; min-height: 2px; background: var(--muted); border-radius: 4px 4px 0 0; }
.hist-bar[data-tone="verified"] { background: var(--verified); }
.hist-bar[data-tone="partial"] { background: var(--partial); }
.hist-bar[data-empty] { background: var(--rule); }
