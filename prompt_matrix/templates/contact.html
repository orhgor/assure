<body class="enterprise-landing contact-landing">
    {% set nav_current = 'contact' %}
    {% include 'includes/landing_header.html' %}

    <main class="contact-main">
        <div class="container" style="text-align: center;">
            <h1 class="section-title" data-i18n="contact.title">{{ strings.get('contact.title', 'Book a demo or request pricing') }}</h1>
            <p class="contact-lead" data-i18n="contact.lead">{{ strings.get('contact.lead', 'Tell us about your documents and workflows. We will follow up with a scoped demo and enterprise pricing — usually within one business day.') }}</p>

            <div class="contact-grid">
                <div class="contact-card">
                    <h2 data-i18n="contact.direct_title">{{ strings.get('contact.direct_title', 'Direct') }}</h2>
                    <p data-i18n="contact.direct_body">{{ strings.get('contact.direct_body', 'Prefer email? Write to us directly and include your use case, document volume, and timeline.') }}</p>
                    <a class="contact-email" href="mailto:sales@getassureai.com">sales@getassureai.com</a>
                </div>

                <div class="contact-card">
                    <h2 data-i18n="contact.form_title">{{ strings.get('contact.form_title', 'Request form') }}</h2>
                    <form class="contact-form" id="contact-form" novalidate>
                        <label for="cf-name" data-i18n="contact.f_name">{{ strings.get('contact.f_name', 'Name') }}</label>
                        <input id="cf-name" name="name" type="text" autocomplete="name" required>
                        <label for="cf-email" data-i18n="contact.f_email">{{ strings.get('contact.f_email', 'Work email') }}</label>
                        <input id="cf-email" name="email" type="email" autocomplete="email" required>
                        <label for="cf-company" data-i18n="contact.f_company">{{ strings.get('contact.f_company', 'Company') }}</label>
                        <input id="cf-company" name="company" type="text" autocomplete="organization">
                        <label for="cf-message" data-i18n="contact.f_message">{{ strings.get('contact.f_message', 'What should the demo cover?') }}</label>
                        <textarea id="cf-message" name="message"></textarea>
                        <button type="submit" class="btn-primary" data-i18n="contact.submit">{{ strings.get('contact.submit', 'Send request') }}</button>
                    </form>
                    <p id="contact-done" data-i18n="contact.done" hidden>{{ strings.get('contact.done', 'Your email client should open with the request pre-filled. If not, write to sales@getassureai.com directly.') }}</p>
                </div>
            </div>
        </div>
    </main>

    {% include 'includes/landing_footer.html' %}
    <script>
        (function () {
            "use strict";
            var form = document.getElementById("contact-form");
            if (!form) return;
            form.addEventListener("submit", function (event) {
                event.preventDefault();
                var get = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
                var subject = "Enterprise demo request — " + (get("cf-company") || get("cf-name") || "Assure");
                var body = "Name: " + get("cf-name") + "\nWork email: " + get("cf-email") + "\nCompany: " + get("cf-company") + "\n\nDemo scope:\n" + get("cf-message");
                window.location.href = "mailto:sales@getassureai.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
                var done = document.getElementById("contact-done");
                if (done) done.hidden = false;
            });
        })();
    </script>
</body>
</html>
