services:
  assure-app:
    image: ${APP_IMAGE:?missing APP_IMAGE}
    env_file:
      # Production carries .env; staging carries .env.staging (optional
      # overlay). Making the base file optional lets one compose definition
      # serve both: a missing .env is not an error when the overlay's
      # env_file supplies the runtime environment.
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      DATABASE_PATH: /app/data/history.sqlite
      ENVIRONMENT: production
      PORT: "8765"
      PYTHONUNBUFFERED: "1"
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      BUILD_SHA: ${BUILD_SHA:-unknown}
      BUILD_BRANCH: ${BUILD_BRANCH:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      ASSURE_BUILD_SHA: ${ASSURE_BUILD_SHA:-${BUILD_SHA:-unknown}}
      ASSURE_BUILD_BRANCH: ${ASSURE_BUILD_BRANCH:-${BUILD_BRANCH:-unknown}}
      ASSURE_BUILD_TIME: ${ASSURE_BUILD_TIME:-${BUILD_TIME:-unknown}}
      ASSURE_SERVICE_API_TOKEN: ${ASSURE_SERVICE_API_TOKEN:-}
      APP_IMAGE: ${APP_IMAGE:-unknown}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  # Optional: expose assure-app via Cloudflare Tunnel (set TUNNEL_TOKEN in .env).
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel run --token ${TUNNEL_TOKEN}
