# Full local stack in one command — no .env required:
#
#   docker compose up -d --build
#   open http://127.0.0.1:8891          (shell, key: SHELL_ACCESS_KEY, default assure-local-shell-key)
#
# EC2 / server: ./scripts/gen-env.sh ec2 writes a .env (generated secrets, Bedrock
# models through the instance IAM role, shell bound to 0.0.0.0); fill in the S3
# bucket + region, then the same `docker compose up -d`.
#   http://127.0.0.1:8765/api/...       (Flask API directly; /app there is the legacy workbench)
#
# PostgreSQL + Redis + web + parse worker, the same topology as AWS
# (infra/terraform). Defaults are for a laptop: development mode, the image is
# built from this checkout, a fixed local database password, login disabled.
# Production/staging use the override files, which turn the fail-fast checks
# back on and require real secrets:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# AWS/S3 is real when configured: set ASSURE_S3_BUCKET + AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY in .env (or enter them on the Sources panel). Without a
# bucket, uploads stay under ./data/objects and the UI shows a warning.
x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-assure}:${POSTGRES_PASSWORD:-assure}@postgres:5432/${POSTGRES_DB:-assure}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
  ASSURE_DATA_DIR: /app/data
  TEMP_UPLOAD_DIR: /app/data/tmp_uploads
  ENVIRONMENT: ${ENVIRONMENT:-development}
  ASSURE_ENV: ${ASSURE_ENV:-development}
  PEM_SECRET_KEY: ${PEM_SECRET_KEY:-assure-local-dev-change-me}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  ASSURE_REQUIRE_LOGIN: ${ASSURE_REQUIRE_LOGIN:-false}
  # Clerk is not configured locally; without this the shell sends every page to /signin.
  ASSURE_CLERK_ONLY: ${ASSURE_CLERK_ONLY:-0}
  WTF_CSRF_ENABLED: ${WTF_CSRF_ENABLED:-0}
  PARSE_ASYNC: ${PARSE_ASYNC:-1}
  SUBSTRATE_ASYNC_UPLOAD: ${SUBSTRATE_ASYNC_UPLOAD:-1}
  PARSER_SCAN_BACKEND: ${PARSER_SCAN_BACKEND:-jdf-ocr}
  JDF_OCR: ${JDF_OCR:-tesseract}
  # Real S3 (leave empty for local disk). Credentials: .env keys, the Sources
  # panel form, or the machine IAM role — in that order.
  ASSURE_S3_BUCKET: ${ASSURE_S3_BUCKET:-}
  ASSURE_S3_PREFIX: ${ASSURE_S3_PREFIX:-assure/}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  # Models. Locally every LLM call goes to the `ollama` container (no provider
  # key, small models); production/staging override ASSURE_LLM_BACKEND to ""
  # and use the OpenRouter/DeepSeek policies in cost_governance.py.
  ASSURE_LLM_BACKEND: ${ASSURE_LLM_BACKEND:-ollama}
  ASSURE_OLLAMA_MODEL: ${ASSURE_OLLAMA_MODEL:-qwen2.5:1.5b}
  ASSURE_OLLAMA_MODEL_B: ${ASSURE_OLLAMA_MODEL_B:-llama3.2:1b}
  OLLAMA_API_BASE: http://ollama:11434
  OLLAMA_HOST: http://ollama:11434
  ASSURE_LOG_STDOUT: "1"
  PYTHONUNBUFFERED: "1"
  BUILD_SHA: ${BUILD_SHA:-local}
  ASSURE_BUILD_SHA: ${ASSURE_BUILD_SHA:-${BUILD_SHA:-local}}
  APP_IMAGE: ${APP_IMAGE:-assure-app:local}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assure}
      POSTGRES_USER: ${POSTGRES_USER:-assure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assure}
    command: >
      postgres -c shared_buffers=128MB -c max_connections=100
      -c log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assure} -d ${POSTGRES_DB:-assure}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # Local models (profile `local-llm`, on with COMPOSE_PROFILES=local-llm in the
  # .env that scripts/gen-env.sh local writes; a server never pulls the 7 GB
  # image): one Ollama daemon, models pulled once into the `ollama` volume by the
  # one-shot `ollama-pull` service. CPU inference; a 1–2B model
  # streams ~5–15 tok/s in Docker Desktop, so a compile takes minutes, not
  # seconds. Change ASSURE_OLLAMA_MODEL(_B) in .env for other sizes.
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          # 1–2B models need ~1.5 GB loaded; 6g let Ollama grow until the Docker
          # Desktop VM (7.7 GiB by default on a Mac) ran out of memory and the
          # daemon restarted, taking every container with it (4× on 2026-09-24).
          memory: ${OLLAMA_MEMORY_LIMIT:-3g}

  ollama-pull:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ "$${ASSURE_LLM_BACKEND}" != "ollama" ]; then
          echo "ASSURE_LLM_BACKEND=$${ASSURE_LLM_BACKEND:-cloud}: no local models to pull"; exit 0;
        fi;
        ollama pull "${ASSURE_OLLAMA_MODEL:-qwen2.5:1.5b}" &&
        ollama pull "${ASSURE_OLLAMA_MODEL_B:-llama3.2:1b}" &&
        echo "models ready"
    environment:
      OLLAMA_HOST: http://ollama:11434
      ASSURE_LLM_BACKEND: ${ASSURE_LLM_BACKEND:-ollama}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  assure-app:
    image: ${APP_IMAGE:-assure-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "${APP_BIND:-127.0.0.1}:${PORT:-8765}:8765"
    environment:
      <<: *app-env
      PORT: "8765"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
      # one PostgreSQL connection per thread at most: 2 workers × (8+2) = 20 per replica
      PG_POOL_SIZE: ${PG_POOL_SIZE:-8}
      PG_POOL_MAX_OVERFLOW: ${PG_POOL_MAX_OVERFLOW:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ASSURE_SERVICE_API_TOKEN: ${ASSURE_SERVICE_API_TOKEN:-}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${ASSURE_APP_MEMORY_LIMIT:-1536m}


  assure-worker:
    image: ${APP_IMAGE:-assure-app:local}
    command: >
      sh -c "exec celery -A prompt_matrix.celery_app:celery_app worker
      --loglevel=info
      --concurrency=${WORKER_CONCURRENCY:-1}
      --prefetch-multiplier=1
      -Q parse,default"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    # The image's default HEALTHCHECK probes the web port, which a Celery
    # process does not serve; ask the worker itself instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A prompt_matrix.celery_app:celery_app inspect ping --timeout 10 -d celery@$$(hostname) >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${ASSURE_WORKER_MEMORY_LIMIT:-2048m}


  # The workbench shell — what staging.getassureai.com serves. Static shell from
  # prototype/ with /api/* proxied to assure-app, behind the SHELL_ACCESS_KEY
  # gate (fails closed if unset). Open http://127.0.0.1:8891 and enter the key.
  assure-shell:
    image: ${APP_IMAGE:-assure-app:local}
    command: ["python", "prototype/dev-server.py"]
    # Serve the working tree's shell, not the image's copy: UI edits show on
    # reload without a rebuild (dev-server sends Cache-Control: no-store).
    volumes:
      - ./prototype:/app/prototype:ro
    environment:
      UPSTREAM_BASE: http://assure-app:8765
      HOST: 0.0.0.0
      PORT: "8891"
      SHELL_ACCESS_KEY: ${SHELL_ACCESS_KEY:-assure-local-shell-key}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${SHELL_BIND:-127.0.0.1}:${SHELL_PORT:-8891}:8891"
    depends_on:
      assure-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8891/auth',timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${ASSURE_SHELL_MEMORY_LIMIT:-256m}


volumes:
  ollama:
  pgdata:
